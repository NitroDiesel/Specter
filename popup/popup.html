<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Specter</title>
  <link rel="stylesheet" href="../styles/base.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!--
    THESIS: Protection is a registration proof where Global, Site, and Tab visibly align; it refuses both stacked extension cards and hacker-console theater.
    OWN-WORLD: Cool proof stock, process cyan/magenta/yellow, crop marks, registration targets, black control bars, and condensed production headings.
    STORY: The user identifies the origin, sees whether the three scopes register, then changes tab protection or pauses the site.
    FIRST VIEWPORT: A compact header and origin lead into one large proof field; the animated registration target fills the left half and the tab control owns the right.
    FORM: Chromatic Registration, fourth grounded direction, seed 37cd53b6.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
  -->
  <main class="popup-shell">
    <header class="popup-header">
      <button class="brand" id="popupMenu" type="button" aria-label="Open Specter settings">
        <img src="../assets/svg/specter-logo.svg" alt="" />
        <span>Specter</span>
      </button>
      <div class="global-control">
        <span id="globalStatusText">Loading state</span>
        <button id="globalSwitch" class="switch" type="button" role="switch" aria-checked="false" aria-label="Toggle Specter globally" disabled></button>
      </div>
    </header>

    <section class="origin" aria-labelledby="tabTitle">
      <div class="origin-copy">
        <h1 id="tabTitle">Reading active tab</h1>
        <p id="tabUrl" class="data">Waiting for browser state…</p>
      </div>
      <button class="origin-open" id="activeTabOpen" type="button" aria-label="Focus active tab" title="Focus active tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h11v11M19 5 8 16M16 12v7H5V8h7" /></svg>
      </button>
    </section>

    <div class="load-error" id="loadError" role="alert" hidden><p id="loadErrorText"></p><button class="button" id="retryLoad" type="button">Try again</button></div>
    <section class="proof-field" aria-label="Protection registration">
      <div class="proof-head">
        <div class="state-readout"><span id="statusDot" class="status-lamp"></span><strong id="stateChipLabel">Checking protection</strong></div>
        <span id="activityChip" class="data">No activity yet</span>
      </div>

      <div class="proof-stage">
        <div class="registration-visual">
          <div class="registration-target" aria-hidden="true">
            <span class="register-layer register-layer--cyan"></span>
            <span class="register-layer register-layer--magenta"></span>
            <span class="register-layer register-layer--yellow"></span>
            <span class="register-cross"></span>
          </div>
          <div class="scope-proof">
            <span><i></i>Global<b id="scopeGlobal">—</b></span>
            <span><i></i>Site<b id="scopeSite">—</b></span>
            <span><i></i>Tab<b id="scopeTab">—</b></span>
          </div>
        </div>

        <div class="tab-control">
          <span class="control-label data">Current tab</span>
          <strong id="tabControlTitle">Checking tab</strong>
          <p id="tabStateLabel">Waiting for an active tab.</p>
          <button id="tabSwitch" class="switch switch--large" type="button" role="switch" aria-checked="false" aria-label="Toggle protection for this tab" aria-describedby="tabStateLabel" disabled></button>
        </div>
      </div>

      <div class="reload-tip" id="reloadBanner" hidden>Automatic reload is armed for the next activation.</div>

      <form id="allowForm" class="pause-form">
        <label for="allowDuration">Pause site</label>
        <select id="allowDuration" name="duration" class="field">
          <option value="30">30 minutes</option>
          <option value="120">2 hours</option>
          <option value="480">8 hours</option>
          <option value="">Until removed</option>
        </select>
        <button type="submit" class="button" id="allowButton" disabled><span>Pause on this site</span></button>
      </form>
    </section>

    <section class="activity-strip" id="quickFacts" aria-label="Local activity" data-ready="false">
      <div><strong id="factTrackers" class="data">0</strong><span>sites observed</span></div>
      <div><strong id="factRequests" class="data">0</strong><span>events logged</span></div>
      <div><strong id="factData" class="data">0</strong><span>exceptions</span></div>
    </section>

    <footer class="popup-footer">
      <button class="popup-action" type="button" id="openOptions">Settings</button>
      <button class="popup-action" type="button" id="openShortcuts">Shortcuts</button>
      <span class="local-note">Local only</span>
    </footer>
  </main>
  <div class="toast" id="popupToast" role="status" aria-live="polite"></div>
  <script src="../styles/theme.js"></script>
  <script src="popup.js"></script>
</body>
</html>
