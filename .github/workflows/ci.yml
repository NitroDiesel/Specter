name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate extension
        run: npm test
      - name: Build release archives
        run: npm run build
      - name: Upload test archives
        uses: actions/upload-artifact@v4
        with:
          name: specter-extension-archives
          path: |
            specter-chrome.zip
            specter-firefox.zip
          if-no-files-found: error
